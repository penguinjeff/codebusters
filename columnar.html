<!DOCTYPE html>
<html>
<head>
<script>
function compute(){
  var columns=parseInt(document.getElementById('columns').value,10);
  console.log('columns:'+columns)
  var input=fix_input(fix_padding(),columns);
  console.log('input length:'+input.length)
  var order=fix_order(columns);
  document.getElementById('output2').innerHTML=Cipher(input,order);
}

function Cipher(input, order) {
  const columns = order.length;
  let output = "";
  for (let i = 0; i < input.length; i += columns) {
    const block = input.slice(i, i + columns);
    for (const col of order) {
      output += block[col - 1];
    }
  }
  return output;
}

function fixwidth(width) {
  var divs = document.getElementsByClassName('monospacecols');
  for (var i = 0; i < divs.length; i++) {
    divs[i].style.width = width + 'ch';
  }
}

function fix_input(padChar, columns) {
  const input = document.getElementById("input");
  // Uppercase and keep only A-Z
  input.value = input.value
    .toUpperCase()
    .replace(/[^A-Z]/g, "");
  while(input.value.endsWith(padChar)){
   input.value=input.value.slice(0,-1);
  }
  // Pad to a multiple of columns
  while(0 !== (input.value.length % columns)){
    input.value += padChar;
  }
  return input.value;
}

function fix_order(columns) {
  const input = document.getElementById("order");
  // Keep only digits and commas
  input.value = input.value.replace(/[^0-9,]/g, "");
  // Split, remove empties, convert to integers
  let order = input.value
    .split(",")
    .filter(v => v !== "")
    .map(v => parseInt(v, 10));
  // Remove invalid columns and duplicate occurrences
  const seen = new Set();
  order = order.filter(col => {
    if (col < 1 || col >= (columns+1)) return false;
    if (seen.has(col)) return false;
      seen.add(col);
      return true;
  });
  // Append any missing columns
  for (let col = 1; col < (columns+1); col++) {
    if (!seen.has(col)) {
      order.push(col);
    }
  }
  // Update input
  input.value = order.join(",");
  return order;
}

function fix_padding(){
 var padding=document.getElementById('padding');
 if(padding.value===""){
  padding.value='X'; 
 }
 console.log('padding:'+padding.value)
 return padding.value;
}

</script>
<style>
input
{
    font-size:64px;
}

div
{
    font-size:64px;
}
.monospace
{
 font-family:monospace;
}
.monospacecols
{
 font-family:monospace;
 overflow-wrap:break-word;
}
</style>
</head>
<body>
Phrase to be encrypted or decrypted:<br><input id="input"><br>
Padding Character:<br><input id="padding" value="X" maxlength="1" pattern="[A-Z]" size="1"><br>
Columns:<br><input id="columns" type="number" oninput="compute()" value="5" max="20" min="2"><br>
Order:<br><input id="order" onchange="compute()" value="1,2,3,4,5"><br>
<input type=button onclick="compute()" value="Submit"><br>
INPUT:<br>
<div class="monospacecols" id="output1"></div>
OUTPUT:<br>
<div class="monospacecols" id="output2"></div>
</body>
</html>
